groups:
  - label: "Nōmina · 1ª (-a)"
    tag: "f."
    entries:
      - lemma: "gena, -ae"
        gloss: "bochecha, face"
      - lemma: "lingua, -ae"
        gloss: "língua"
      - lemma: "vēna, -ae"
        gloss: "veia"

  - label: "Nōmina · 2ª (-us, -um, -er)"
    tag: "m. / n."
    entries:
      - lemma: "bracchium, -ī"
        gloss: "braço"
        note: "n."
      - lemma: "capillus, -ī"
        gloss: "cabelo"
        note: "m."
      - lemma: "cerebrum, -ī"
        gloss: "cérebro"
        note: "n."
      - lemma: "culter, cultrī"
        gloss: "faca"
        note: "m.; tipo <i>-er, -rī</i>"
      - lemma: "labrum, -ī"
        gloss: "lábio"
        note: "n."
      - lemma: "medicus, -ī"
        gloss: "médico"
        note: "m."
      - lemma: "membrum, -ī"
        gloss: "membro"
        note: "n."
      - lemma: "pōculum, -ī"
        gloss: "taça, copo"
        note: "n."

  - label: "Nōmina · 3ª — neutros"
    tag: "n."
    entries:
      - lemma: "caput, capitis"
        gloss: "cabeça"
        note: "radical irregular <i>capit-</i>"
      - lemma: "cor, cordis"
        gloss: "coração"
        note: "radical irregular <i>cord-</i>"
      - lemma: "corpus, corporis"
        gloss: "corpo"
        note: "<i>-us → -or-</i>"
      - lemma: "crūs, crūris"
        gloss: "perna"
        note: "<i>-s → -r-</i>"
      - lemma: "iecur, iecoris"
        gloss: "fígado"
        note: "<i>-ur → -or-</i>"
      - lemma: "ōs, ōris"
        gloss: "boca"
        note: "<i>-s → -r-</i>; ≠ <i>os, ossis</i> 'osso'"
      - lemma: "pectus, pectoris"
        gloss: "peito"
        note: "<i>-us → -or-</i>"
      - lemma: "viscera, viscerum"
        gloss: "vísceras"
        note: "só plural"

  - label: "Nōmina · 3ª — masculinos e femininos"
    tag: "m. / f."
    entries:
      - lemma: "auris, auris"
        gloss: "orelha, ouvido"
        note: "f."
      - lemma: "color, colōris"
        gloss: "cor"
        note: "m."
      - lemma: "frōns, frontis"
        gloss: "testa, fronte"
        note: "f."
      - lemma: "sanguis, sanguinis"
        gloss: "sangue"
        note: "m."
      - lemma: "venter, ventris"
        gloss: "ventre, barriga"
        note: "m."

  - label: "Nōmina · 4ª"
    tag: "f."
    entries:
      - lemma: "manus"
        gloss: "mão"
        note: "f.; 4ª declinação — paradigma no cap. XII"

  - label: "Verba · 1ª (-āre)"
    entries:
      - lemma: "aegrōtāre"
        gloss: "estar doente"
        note: "= <i>aeger esse</i>"
      - lemma: "palpitāre"
        gloss: "palpitar, bater"
      - lemma: "putāre"
        gloss: "achar, julgar"
        note: "rege acus. + inf."
      - lemma: "sānāre"
        gloss: "curar"
        note: "= <i>sānum facere</i>"
      - lemma: "spectāre"
        gloss: "olhar, observar"
        note: "= <i>aspicere</i>"
      - lemma: "stāre"
        gloss: "estar de pé"

  - label: "Verba · 2ª (-ēre)"
    entries:
      - lemma: "dētergēre"
        gloss: "limpar, enxugar"
        note: "3ª pess. sg. <i>dēterget</i>"
      - lemma: "dolēre"
        gloss: "doer, sofrer"
      - lemma: "gaudēre"
        gloss: "alegrar-se"
        note: "= <i>laetus esse</i>; rege acus. + inf."
      - lemma: "horrēre"
        gloss: "arrepiar-se, ter horror"
      - lemma: "iubēre"
        gloss: "mandar, ordenar"
        note: "= <i>imperāre</i>; rege acus. + inf."
      - lemma: "sedēre"
        gloss: "estar sentado"

  - label: "Verba · 3ª (-ere)"
    entries:
      - lemma: "appōnere"
        gloss: "pôr junto, encostar"
        note: "&lt; <i>ad + pōnere</i>"
      - lemma: "arcessere"
        gloss: "mandar buscar, chamar"
      - lemma: "dīcere"
        gloss: "dizer"
      - lemma: "fluere"
        gloss: "fluir, correr"
      - lemma: "tangere"
        gloss: "tocar"

  - label: "Verba · 4ª (-īre)"
    entries:
      - lemma: "revenīre"
        gloss: "voltar"
        note: "= <i>rūrsus venīre</i>"
      - lemma: "sentīre"
        gloss: "sentir, perceber"

  - label: "Verba irregulāria"
    entries:
      - lemma: "posse"
        gloss: "poder"
        note: "inf. de <i>potest/possunt</i> (<i>pot-</i> + <i>esse</i>)"

  - label: "Adiectīva · 1ª/2ª"
    entries:
      - lemma: "aeger, -gra, -grum"
        gloss: "doente"
      - lemma: "hūmānus, -a, -um"
        gloss: "humano"
        note: "&lt; <i>homō</i>"
      - lemma: "noster, nostra, nostrum"
        gloss: "nosso"
      - lemma: "quiētus, -a, -um"
        gloss: "quieto, imóvel"
        note: "glosa marginal: <i>quī sē nōn movet</i>"
      - lemma: "ruber, rubra, rubrum"
        gloss: "vermelho"
      - lemma: "sānus, -a, -um"
        gloss: "são, saudável"
        note: "↔ <i>aeger</i>"
      - lemma: "stultus, -a, -um"
        gloss: "tolo, estúpido"

  - label: "Adverbia"
    entries:
      - lemma: "bene"
        gloss: "bem"
      - lemma: "male"
        gloss: "mal"
      - lemma: "modo"
        gloss: "só, apenas"
        note: "= <i>tantum, sōlum</i>"

  - label: "Praepositiōnēs"
    entries:
      - lemma: "dē"
        gloss: "de (cima de); a respeito de"
        note: "+ abl."
      - lemma: "īnfrā"
        gloss: "abaixo de"
        note: "+ acus.; ↔ <i>suprā</i>"
      - lemma: "super"
        gloss: "sobre, em cima de"
        note: "+ acus.; ↔ <i>sub</i>"

  - label: "Coniūnctiōnēs"
    entries:
      - lemma: "atque / ac"
        gloss: "e"
        note: "<i>ac</i> só diante de consoante (não antes de <i>h-</i>)"
      - lemma: "nec"
        gloss: "e não, nem"
        note: "= <i>neque</i>; diante de consoante ou vogal"
