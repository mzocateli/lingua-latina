groups:
  - label: "Nōmina · 1ª (-a)"
    tag: "f."
    entries:
      - lemma: "fossa, -ae"
        gloss: "fosso, vala"
      - lemma: "hasta, -ae"
        gloss: "lança"
      - lemma: "patria, -ae"
        gloss: "pátria, terra natal"
      - lemma: "sagitta, -ae"
        gloss: "flecha"

  - label: "Nōmina · 2ª (-us, -um, -er)"
    tag: "m. / n."
    entries:
      - lemma: "adiectīvum, -ī"
        gloss: "adjetivo"
        note: "n.; <i>nōmen adiectīvum</i>"
      - lemma: "avunculus, -ī"
        gloss: "tio (irmão da mãe)"
        note: "m.; o irmão do pai é <i>pātruus</i>"
      - lemma: "bellum, -ī"
        gloss: "guerra"
        note: "n."
      - lemma: "comparātīvus, -ī"
        gloss: "comparativo"
        note: "m.; <i>gradus comparātīvus</i>"
      - lemma: "gladius, -ī"
        gloss: "espada"
        note: "m."
      - lemma: "pīlum, -ī"
        gloss: "dardo, pilo"
        note: "n."
      - lemma: "pugnus, -ī"
        gloss: "punho"
        note: "m."
      - lemma: "scūtum, -ī"
        gloss: "escudo"
        note: "n."
      - lemma: "vāllum, -ī"
        gloss: "paliçada, muralha"
        note: "n."

  - label: "Nōmina · plūrāle tantum"
    tag: "só plural"
    entries:
      - lemma: "arma, -ōrum"
        gloss: "armas"
        note: "n. pl.; verbo no plural"
      - lemma: "castra, -ōrum"
        gloss: "acampamento"
        note: "n. pl.; <i>castra sunt</i> = há um acampamento"
      - lemma: "līberī, -ōrum"
        gloss: "filhos"
        note: "m. pl."

  - label: "Nōmina · 3ª"
    tag: "m. / f. / n."
    entries:
      - lemma: "cognōmen, -inis"
        gloss: "cognome, sobrenome"
        note: "n."
      - lemma: "dux, ducis"
        gloss: "chefe, general"
        note: "m."
      - lemma: "eques, equitis"
        gloss: "cavaleiro, soldado a cavalo"
        note: "m.; radical <i>equit-</i>"
      - lemma: "fīnis, fīnis"
        gloss: "fronteira, limite, fim"
        note: "m."
      - lemma: "frāter, frātris"
        gloss: "irmão"
        note: "m."
      - lemma: "hostis, hostis"
        gloss: "inimigo"
        note: "m."
      - lemma: "lātus, lāteris"
        gloss: "lado, flanco"
        note: "n.; não confundir com o adj. <i>lātus, -a, -um</i>"
      - lemma: "mīles, mīlitis"
        gloss: "soldado"
        note: "m.; radical <i>mīlit-</i>"
      - lemma: "mīlia, mīlium"
        gloss: "milhares"
        note: "n. pl.; + genitivo partitivo"
      - lemma: "nōmen, nōminis"
        gloss: "nome (da <i>gēns</i>)"
        note: "n."
      - lemma: "pars, partis"
        gloss: "parte, lado"
        note: "f."
      - lemma: "pedes, peditis"
        gloss: "soldado de infantaria"
        note: "m.; radical <i>pedit-</i>"
      - lemma: "praenōmen, -inis"
        gloss: "prenome"
        note: "n."
      - lemma: "soror, sorōris"
        gloss: "irmã"
        note: "f."

  - label: "Nōmina · 4ª (-us, gen. -ūs)"
    tag: "m."
    entries:
      - lemma: "arcus, arcūs"
        gloss: "arco"
        note: "m."
      - lemma: "equitātus, -ūs"
        gloss: "cavalaria"
        note: "m."
      - lemma: "exercitus, -ūs"
        gloss: "exército"
        note: "m."
      - lemma: "impetus, -ūs"
        gloss: "investida, ataque"
        note: "m.; <i>impetum facere in</i> + acus."
      - lemma: "metus, -ūs"
        gloss: "medo"
        note: "m.; = <i>timor</i>"
      - lemma: "passus, -ūs"
        gloss: "passo (= 5 pés)"
        note: "m."
      - lemma: "versus, -ūs"
        gloss: "verso, linha"
        note: "m."

  - label: "Verba · 1ª (-āre)"
    tag: "conj. I"
    entries:
      - lemma: "expugnat, expugnāre"
        gloss: "tomar de assalto, conquistar"
      - lemma: "mīlitat, mīlitāre"
        gloss: "servir como soldado"
      - lemma: "oppugnat, oppugnāre"
        gloss: "atacar"
      - lemma: "pugnat, pugnāre"
        gloss: "lutar, combater"

  - label: "Verba · 3ª (-ere)"
    tag: "conj. III"
    entries:
      - lemma: "dēfendit, dēfendere"
        gloss: "defender"
      - lemma: "dīvidit, dīvidere"
        gloss: "dividir, separar"
      - lemma: "incolit, incolere"
        gloss: "habitar"
      - lemma: "metuit, metuere"
        gloss: "temer"
        note: "tema em <i>-u-</i>: <i>metuunt</i>"
      - lemma: "capit, capere"
        gloss: "tomar, pegar"
        note: "tema em <i>-i-</i>: <i>capiunt</i>"
      - lemma: "fugit, fugere"
        gloss: "fugir"
        note: "tema em <i>-i-</i>: <i>fugiunt</i>"
      - lemma: "iacit, iacere"
        gloss: "lançar, atirar"
        note: "tema em <i>-i-</i>: <i>iaciunt</i>"

  - label: "Verba · irregulāria"
    tag: "irreg."
    entries:
      - lemma: "fert, ferre"
        gloss: "levar, carregar, trazer"
        note: "<i>fert, ferunt, fertur, feruntur</i>; imper. <i>fer! ferte!</i>"

  - label: "Adiectīva · 1ª/2ª"
    tag: "-us/-er, -a, -um"
    entries:
      - lemma: "altus, -a, -um"
        gloss: "alto, profundo"
      - lemma: "armātus, -a, -um"
        gloss: "armado"
      - lemma: "barbarus, -a, -um"
        gloss: "bárbaro, estrangeiro"
      - lemma: "lātus, -a, -um"
        gloss: "largo"
      - lemma: "vester, -tra, -trum"
        gloss: "vosso"

  - label: "Adiectīva · 3ª"
    tag: "-is, -e"
    entries:
      - lemma: "brevis, -e"
        gloss: "curto, breve"
      - lemma: "fortis, -e"
        gloss: "forte, valente"
      - lemma: "gravis, -e"
        gloss: "pesado, grave"
      - lemma: "levis, -e"
        gloss: "leve"
      - lemma: "trīstis, -e"
        gloss: "triste"

  - label: "Particulae"
    tag: "prep. / conj."
    entries:
      - lemma: "contrā"
        gloss: "contra"
        note: "prep. + acusativo"
      - lemma: "ac"
        gloss: "e; do que"
        note: "= <i>atque</i>"
