groups:
  - label: "Nōmina · 1ª (-a)"
    tag: "f."
    entries:
      - lemma: "āla, -ae"
        gloss: "asa"
      - lemma: "anima, -ae"
        gloss: "sopro, vida, alma"
      - lemma: "aquila, -ae"
        gloss: "águia"
      - lemma: "bēstia, -ae"
        gloss: "animal, fera"
      - lemma: "cauda, -ae"
        gloss: "cauda"
      - lemma: "fera, -ae"
        gloss: "fera, animal selvagem"
      - lemma: "pila, -ae"
        gloss: "bola"

  - label: "Nōmina · 2ª (-us, -um)"
    tag: "m. / n."
    entries:
      - lemma: "asinus, -ī"
        gloss: "asno"
        note: "m."
      - lemma: "deus, -ī"
        gloss: "deus"
        note: "m.; pl. <i>deī/diī/dī</i>, voc. <i>deus</i>"
      - lemma: "folium, -ī"
        gloss: "folha"
        note: "n."
      - lemma: "lectus, -ī"
        gloss: "leito, cama"
        note: "m."
      - lemma: "nīdus, -ī"
        gloss: "ninho"
        note: "m."
      - lemma: "nūntius, -ī"
        gloss: "mensageiro, mensagem"
        note: "m."
      - lemma: "ōvum, -ī"
        gloss: "ovo"
        note: "n."
      - lemma: "petasus, -ī"
        gloss: "chapéu de abas"
        note: "m."
      - lemma: "pullus, -ī"
        gloss: "filhote (de ave)"
        note: "m."
      - lemma: "rāmus, -ī"
        gloss: "ramo"
        note: "m."

  - label: "Nōmina · 3ª"
    tag: "m./f./n."
    entries:
      - lemma: "āēr, āeris"
        gloss: "ar"
        note: "m."
      - lemma: "animal, animālis"
        gloss: "animal"
        note: "n.; i-stem"
      - lemma: "avis, avis"
        gloss: "ave"
        note: "f.; i-stem"
      - lemma: "flūmen, flūminis"
        gloss: "rio"
        note: "n."
      - lemma: "homō, hominis"
        gloss: "ser humano"
        note: "m.; nom. irreg."
      - lemma: "leō, leōnis"
        gloss: "leão"
        note: "m.; nom. irreg."
      - lemma: "mare, maris"
        gloss: "mar"
        note: "n.; i-stem"
      - lemma: "mercātor, mercātōris"
        gloss: "mercador"
        note: "m."
      - lemma: "pēs, pedis"
        gloss: "pé"
        note: "m."
      - lemma: "piscis, piscis"
        gloss: "peixe"
        note: "m.; i-stem"
      - lemma: "pulmō, pulmōnis"
        gloss: "pulmão"
        note: "m."
      - lemma: "vōx, vōcis"
        gloss: "voz"
        note: "f."

  - label: "Verba · 1ª (-āre)"
    entries:
      - lemma: "natāre"
        gloss: "nadar"
      - lemma: "occultāre"
        gloss: "esconder"
      - lemma: "spīrāre"
        gloss: "respirar"
      - lemma: "volāre"
        gloss: "voar"

  - label: "Verba · 2ª (-ēre)"
    entries:
      - lemma: "audēre"
        gloss: "ousar"
      - lemma: "movēre"
        gloss: "mover"
      - lemma: "sustinēre"
        gloss: "sustentar, suportar"

  - label: "Verba · 3ª (-ere)"
    entries:
      - lemma: "ascendere"
        gloss: "subir"
      - lemma: "cadere"
        gloss: "cair"
      - lemma: "canere"
        gloss: "cantar"
      - lemma: "lūdere"
        gloss: "brincar, jogar"
      - lemma: "vīvere"
        gloss: "viver"

  - label: "Verba · 3ª (-iō)"
    entries:
      - lemma: "capere"
        gloss: "capturar, pegar"
      - lemma: "facere"
        gloss: "fazer"
      - lemma: "parere"
        gloss: "parir; pôr (ovos)"

  - label: "Verba irregulāria"
    entries:
      - lemma: "posse"
        gloss: "poder"
        note: "sg. <i>potest</i>, pl. <i>possunt</i>"
      - lemma: "velle"
        gloss: "querer"
        note: "sg. <i>vult</i>, pl. <i>volunt</i>"
      - lemma: "necesse est"
        gloss: "é necessário"
        note: "impessoal + dat. de pessoa"

  - label: "Adiectīva"
    entries:
      - lemma: "crassus, -a, -um"
        gloss: "grosso, gordo"
      - lemma: "ferus, -a, -um"
        gloss: "selvagem, feroz"
      - lemma: "mortuus, -a, -um"
        gloss: "morto"
      - lemma: "perterritus, -a, -um"
        gloss: "apavorado"
      - lemma: "vīvus, -a, -um"
        gloss: "vivo"
      - lemma: "tenuis, -e"
        gloss: "fino, delgado"
        note: "3ª decl. (cap. XII)"

  - label: "Prōnōmina, adverbia"
    entries:
      - lemma: "nēmō"
        gloss: "ninguém"
        note: "= <i>nē + homō</i>"
      - lemma: "ergō"
        gloss: "portanto"

  - label: "Coniūnctiōnēs"
    entries:
      - lemma: "cum"
        gloss: "quando"
        note: "conj. temporal (≠ prep. <i>cum</i> + abl.)"
      - lemma: "enim"
        gloss: "pois"
        note: "pospositiva"
      - lemma: "quod"
        gloss: "porque"
        note: "= <i>quia</i>"
